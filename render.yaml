services:
  - type: web
    name: goals-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: mygoals_bot
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: CORS_ORIGINS
        value: https://vgametikok.github.io
      - key: NODE_ENV
        value: production
